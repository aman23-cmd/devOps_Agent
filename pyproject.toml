[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-pipeline-agent"
version = "2.0.0"
description = "Autonomous AI-powered DevOps agent that diagnoses CI/CD pipeline failures and auto-applies fixes."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aman Kaushal", email = "amankau2000@gmail.com"},
]
keywords = ["devops", "cicd", "ai", "automation", "pipeline", "llm", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "anthropic>=0.42.0",
    "pyautogen==0.2.35",
    "PyGithub>=2.5.0",
    "slack-sdk>=3.34.0",
    "httpx>=0.28.0",
    "aiohttp>=3.9.0",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-logging>=3.11.0",
    "boto3>=1.35.0",
]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
devops-agent = "devops_agent.cli:main"

[project.urls]
Homepage = "https://github.com/aman23-cmd/devOps_Agent"
Repository = "https://github.com/aman23-cmd/devOps_Agent"
Issues = "https://github.com/aman23-cmd/devOps_Agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["devops_agent*"]

[tool.setuptools.package-data]
"devops_agent.dashboard" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
